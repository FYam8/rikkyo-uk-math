name: Canonical engine update candidate

on:
  workflow_dispatch:
    inputs:
      master_commit:
        description: Immutable FYam8/waseshibu-math commit SHA
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate immutable source
        env:
          SOURCE_SHA: ${{ inputs.master_commit }}
        run: '[[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]'

      - name: Checkout Rikkyo
        uses: actions/checkout@v4
        with:
          path: rikkyo

      - name: Checkout pinned WaseShibu source
        uses: actions/checkout@v4
        with:
          repository: FYam8/waseshibu-math
          ref: ${{ inputs.master_commit }}
          path: waseshibu

      - name: Install test dependency
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir sympy playwright
          python -m playwright install --with-deps chromium

      - name: Sync declared engine paths only
        working-directory: rikkyo
        run: node scripts/sync-engine.mjs ../waseshibu "${{ inputs.master_commit }}"

      - name: Run downstream full regression
        working-directory: rikkyo
        run: node scripts/run-regression.mjs

      - name: Create candidate pull request
        working-directory: rikkyo
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.master_commit }}
        run: |
          branch="engine-sync/${SOURCE_SHA}"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git switch -c "$branch"
          git add src/engine engine-source.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: sync canonical engine ${SOURCE_SHA}"
          git push --set-upstream origin "$branch"
          gh pr create --base main --head "$branch" --title "Canonical engine update ${SOURCE_SHA:0:12}" --body "Pinned WaseShibu source: ${SOURCE_SHA}. Downstream full regression passed before this candidate was opened. Deployment still requires normal PR acceptance."
