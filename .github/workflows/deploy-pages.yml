name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify canonical release manifest
        run: |
          node scripts/build-canonical-content.mjs
          node scripts/verify-release-manifest.mjs

      - name: Install Python and browser test dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir sympy playwright
          python -m playwright install --with-deps chromium

      - name: Run release tests
        run: |
          node scripts/run-regression.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
