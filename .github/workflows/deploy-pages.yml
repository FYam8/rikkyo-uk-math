name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify RC2 release manifest
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, sys
          root = pathlib.Path('.')
          manifest = json.loads((root/'release_manifest.json').read_text())
          assert manifest['release'] == 'v1.0-rc2'
          assert manifest['pastExamQuestions'] == 212
          assert manifest['fullyAuthoredPastExamExplanations'] == 212
          assert manifest['practiceBankQuestions'] == 411
          assert manifest['totalProblemIds'] == 623
          errors=[]
          for rel, expected in manifest['fileChecksums'].items():
              p=root/rel
              if not p.is_file():
                  errors.append(f'missing: {rel}')
                  continue
              got=hashlib.sha256(p.read_bytes()).hexdigest()
              if got != expected:
                  errors.append(f'hash mismatch: {rel}')
          if errors:
              print('\n'.join(errors))
              sys.exit(1)
          print(f"manifest verified: {len(manifest['fileChecksums'])} files")
          PY

      - name: Install Python test dependency
        run: python -m pip install --disable-pip-version-check --no-cache-dir sympy

      - name: Run release tests
        run: |
          node --check app.js
          node --check scoring.js
          node --check storage.js
          node tests/content.test.js
          node tests/scoring_all.test.js
          node tests/storage.test.js
          node tests/release_invariants.test.js
          node tests/all_explanations.test.js
          python tests/bank_math_verify.py
          python tests/fy24a_math_verify.py
          python tests/fy24b_math_verify.py
          python tests/fy25a_full_math_verify.py
          python tests/fy25b_math_verify.py
          python tests/fy26a_math_verify.py
          python tests/fy26b_math_verify.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
