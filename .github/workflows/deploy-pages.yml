name: Deploy GitHub Pages

on:
  workflow_run:
    workflows: [Verify canonical Rikkyo candidate]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify canonical release manifest
        run: |
          node scripts/build-canonical-content.mjs
          node scripts/verify-release-manifest.mjs

      - name: Install Python and browser test dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir sympy playwright
          python -m playwright install --with-deps chromium

      - name: Run release tests
        run: |
          node scripts/run-regression.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Two post-deploy regression and browser audit rounds
        run: |
          for round in 1 2; do
            node scripts/run-regression.mjs
            python tests/production_browser_audit.py --url "${{ steps.deployment.outputs.page_url }}" --out "/tmp/rikkyo-production-audit-$round"
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-browser-audit
          path: /tmp/rikkyo-production-audit-*
